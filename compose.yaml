
services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: shop-test-beam-app
        restart: unless-stopped
        working_dir: /var/www/html
        environment:
            APP_ENV: production
            APP_DEBUG: "false"
            APP_URL: http://localhost:8000
            APP_KEY: ${APP_KEY:-base64:M+yi9jI6tD58j2FAxyz8q78yibo+lvjRSGf6Bb877Vs=}
            LOG_CHANNEL: stderr
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: shop_test_beam
            DB_USERNAME: shop_user
            DB_PASSWORD: shop_password
            SESSION_DRIVER: file
            CACHE_STORE: file
            QUEUE_CONNECTION: sync
            BROADCAST_CONNECTION: reverb
            REVERB_APP_ID: shop-test-beam
            REVERB_APP_KEY: shop-test-key
            REVERB_APP_SECRET: shop-test-secret
            REVERB_HOST: reverb
            REVERB_PORT: 8080
            REVERB_SCHEME: http
            RUN_MIGRATIONS: "true"
            DB_SEED: "true"
        depends_on:
            postgres:
                condition: service_healthy

    assets:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: shop-test-beam-assets
        volumes:
            - app_public:/public
        command: sh -c "cp -a /var/www/html/public/. /public/"
        restart: "no"

    web:
        image: nginx:alpine
        container_name: shop-test-beam-web
        restart: unless-stopped
        ports:
            - "8000:80"
        volumes:
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
            - app_public:/var/www/html/public:ro
        depends_on:
            app:
                condition: service_started
            assets:
                condition: service_completed_successfully

    reverb:
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "8080:8080"
        restart: unless-stopped
        command: php artisan reverb:start --host=0.0.0.0 --port=8080
        environment:
            APP_ENV: production
            APP_DEBUG: "false"
            APP_KEY: ${APP_KEY:-base64:M+yi9jI6tD58j2FAxyz8q78yibo+lvjRSGf6Bb877Vs=}
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: shop_test_beam
            DB_USERNAME: shop_user
            DB_PASSWORD: shop_password
            BROADCAST_CONNECTION: reverb
            REVERB_APP_ID: shop-test-beam
            REVERB_APP_KEY: shop-test-key
            REVERB_APP_SECRET: shop-test-secret
            REVERB_HOST: 0.0.0.0
            REVERB_PORT: 8080
            REVERB_SCHEME: http
        depends_on:
            postgres:
                condition: service_healthy

    postgres:
        image: postgres:16-alpine
        container_name: shop-test-beam-db
        restart: unless-stopped
        environment:
            POSTGRES_DB: shop_test_beam
            POSTGRES_USER: shop_user
            POSTGRES_PASSWORD: shop_password
        ports:
            - "5433:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U shop_user -d shop_test_beam"]
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    postgres_data:
    app_public:
