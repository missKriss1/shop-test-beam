services:
  postgres:
    image: postgres:16-alpine
    container_name: shop-test-beam-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: shop_test_beam
      POSTGRES_USER: shop_user
      POSTGRES_PASSWORD: shop_password
    ports:
        - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop_user -d shop_test_beam"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
